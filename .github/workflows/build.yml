# Checks the repo, then builds the Windows installer and the Linux packages from it. Called by CI on every push and pull
# request, and by Release before it publishes. The builds only start once every check has passed.
#
# Caches are only saved from main: GitHub lets tags and pull requests read main's caches but not each other's, so main is
# what keeps release builds warm.
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to check out (the triggering commit when empty)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  frontend:
    name: Check the frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release notes are written
        run: pnpm changelog
      - name: Formatted
        run: pnpm exec prettier --check .
      - name: Lint
        run: pnpm lint
      - name: Type check and build
        run: pnpm build
      - name: Test
        run: pnpm test

  rust:
    name: Check the backend (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - name: Install Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Tauri expects the built frontend to exist; the checks don't need it, so an empty folder will do.
      - run: mkdir -p ../dist
      - name: Formatted
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  windows:
    name: Build for Windows
    needs: [frontend, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Build for Linux
    needs: [frontend, rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      # Only runs the build script: pnpm runs inside the container, so there's no pnpm here to cache.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      # The build runs in a container, but the cache is keyed on the runner's Rust, which is the same pinned version.
      - name: Install Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target/linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Builds in the same Ubuntu 22.04 container as on a desktop (scripts/build-linux.ts), with the runner's podman.
      # The release notes were checked above, so this skips `pnpm dist:linux`'s own check.
      - run: node scripts/build-linux.ts
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            src-tauri/target/linux/release/bundle/appimage/*.AppImage
            src-tauri/target/linux/release/bundle/deb/*.deb
            src-tauri/target/linux/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
