# Checks the repo and builds the Windows installer and the Linux packages from it, starts each build to check it stays
# open, and checks the release scripts against them. Called by CI on every push and pull request, and by Release before
# it publishes. The checks and builds run side by side, to finish sooner; Release only publishes once every one of them
# has passed.
#
# Caches are only saved from main: GitHub lets tags and pull requests read main's caches but not each other's, so main is
# what keeps release builds warm.
#
# Third-party actions are pinned to a commit, with its version as a comment, so a moved tag can't change what runs in
# Release next to the signing key; GitHub's own actions follow their major version tags. To update a pin, take the
# commit of a release that has been out for a week or more.
#
# With `sign`, the Windows build is signed with the code signing certificate, which is kept in Certum's cloud and
# reached through SimplySign Desktop. It needs the secrets CERTUM_USERNAME (the SimplySign account's email) and
# CERTUM_TOTP_SECRET (the secret from the otpauth:// link SimplySign gave when the account was activated).
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to check out (the triggering commit when empty)
        type: string
        default: ""
      sign:
        description: Sign the Windows build with the code signing certificate
        type: boolean
        default: false
    secrets:
      CERTUM_USERNAME:
        required: false
      CERTUM_TOTP_SECRET:
        required: false

permissions:
  contents: read

jobs:
  frontend:
    name: Check the frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release notes are written
        run: pnpm changelog
      - name: Formatted
        run: pnpm exec prettier --check .
      - name: Lint
        run: pnpm lint
      - name: Translation catalogues are up to date
        run: pnpm i18n && git diff --exit-code src/locales
      - name: Type check and build
        run: pnpm build
      - name: Test
        run: pnpm test

  rust:
    name: Check the backend (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - name: Install Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Tauri expects the built frontend to exist; the checks don't need it, so an empty folder will do.
      - run: mkdir -p ../dist
      - name: Formatted
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  windows:
    name: Build for Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      # `pnpm dist` in two halves: compiled first, then bundled into the installer. When signing, the certificate is only
      # available while bundling, so the dependencies' build scripts never run with it. The frontend job checks the
      # release notes.
      - run: pnpm exec tauri build --no-bundle
      - name: Sign in to SimplySign
        id: certum
        if: inputs.sign
        uses: jay0lee/certum-cloud-code-sign@a3324503499c49090869856eeeecfe95fb613d87 # v1
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp_secret: ${{ secrets.CERTUM_TOTP_SECRET }}
          # The certificate's thumbprint, which changes when it's renewed (it expires on 2027-10-14).
          cert_sha1: E69CB959A6F5FD84D053BACBB3A0F1EB13E65DA7
      # Tauri signs the launcher, its uninstaller and the installer with the sign command, when there is one.
      - name: Bundle the installer
        shell: pwsh
        run: |
          $config = @()
          if ($env:SIGNTOOL) {
            $file = "$env:RUNNER_TEMP\signing.conf.json"
            $sign = "sign", "/sha1", $env:THUMBPRINT, "/fd", "sha256", "/tr", "http://time.certum.pl", "/td", "sha256", "%1"
            @{ bundle = @{ windows = @{ signCommand = @{ cmd = $env:SIGNTOOL; args = $sign } } } } |
              ConvertTo-Json -Depth 5 | Set-Content $file
            $config = "--config", $file
          }
          pnpm exec tauri bundle --bundles nsis @config
        env:
          SIGNTOOL: ${{ steps.certum.outputs.signtool-path }}
          THUMBPRINT: ${{ steps.certum.outputs.cert-thumbprint }}
      # Tauri puts the unsigned launcher back in target/release after bundling, so this checks the one it installs.
      - name: Installer and launcher are signed
        if: inputs.sign
        shell: pwsh
        run: |
          $installer = (Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
          $dir = "$env:RUNNER_TEMP\signed"
          Start-Process $installer -ArgumentList "/S", "/D=$dir" -Wait
          foreach ($file in @($installer) + (Get-ChildItem $dir -Filter *.exe).FullName) {
            & $env:SIGNTOOL verify /pa $file
            if ($LASTEXITCODE) { throw "$file isn't signed." }
          }
        env:
          SIGNTOOL: ${{ steps.certum.outputs.signtool-path }}
      - name: Sign out of SimplySign
        if: always() && steps.certum.outcome != 'skipped'
        uses: jay0lee/certum-cloud-code-sign/teardown@a3324503499c49090869856eeeecfe95fb613d87 # v1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Installs, starts and stays open
        shell: bash
        run: node scripts/smoke-test.ts src-tauri/target/release/bundle/nsis/*-setup.exe

  linux:
    name: Build for Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # The build container is kept in GitHub's container registry, and published there from main when it changes.
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      # Only runs the build script: pnpm runs inside the container, so there's no pnpm here to cache.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      # The build runs in a container, but the cache is keyed on the runner's Rust, which is the same pinned version.
      - name: Install Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target/linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Without it the build still works: it builds the container here instead of pulling it.
      - name: Sign in to the container registry
        continue-on-error: true
        run: echo "$TOKEN" | podman login ghcr.io --username "$ACTOR" --password-stdin
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
      # Builds in the same Ubuntu 22.04 container as on a desktop (scripts/build-linux.ts), with the runner's podman.
      # The release notes are checked by the frontend job, so this skips `pnpm dist:linux`'s own check.
      - run: node scripts/build-linux.ts
        env:
          LINUX_BUILD_REGISTRY: ghcr.io/${{ github.repository }}/linux-build
          LINUX_BUILD_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            src-tauri/target/linux/release/bundle/appimage/*.AppImage
            src-tauri/target/linux/release/bundle/deb/*.deb
            src-tauri/target/linux/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
      # AppImages leave the graphics libraries to the system, as each computer needs its own drivers. Desktops have them;
      # the runner doesn't, so it gets Mesa's, which draw without a graphics card.
      - name: Install a virtual display and graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libgles2 libgbm1 libgl1-mesa-dri
      - name: Starts and stays open
        run: xvfb-run --auto-servernum node scripts/smoke-test.ts src-tauri/target/linux/release/bundle/appimage/*.AppImage

  # Goes through publishing with both builds, as far as it can without the signing key, so a release script that no
  # longer fits the builds or the changelog shows up here rather than on release day.
  release:
    name: Check the release
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Where Release's publish job puts them too.
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: src-tauri/target/linux/release/bundle
      - run: node scripts/publish-update.ts check
