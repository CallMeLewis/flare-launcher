# Builds a release on Windows and Linux, signs it and publishes it as a GitHub release, then updates the update feed.
# Runs when `pnpm release` pushes a v<version> tag. To build a tag again, run it from the Actions tab on main and enter
# the tag: the workflow then comes from main, with any fixes, and the code from the tag.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the contents of the update signing key). With the secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID it also copies the feed to the old address on R2, which copies installed
# before the move to GitHub still read.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, such as v1.2.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Run this on the tag v$version (package.json's version), not $TAG."
            exit 1
          fi
      - name: Release notes are written
        run: node scripts/check-changelog.mjs

  windows:
    name: Build for Windows
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Build for Linux
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Builds in the same Ubuntu 22.04 container as on a desktop (scripts/build-linux.mjs), with the runner's podman.
      - run: pnpm dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/linux/release/bundle/appimage/*.AppImage
            src-tauri/target/linux/release/bundle/deb/*.deb
            src-tauri/target/linux/release/bundle/rpm/*.rpm
          if-no-files-found: error

  publish:
    name: Publish
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Back where the builds would be on a desktop, which is where the release script looks for them.
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: src-tauri/target/linux/release/bundle
      - name: Sign and publish
        run: node scripts/publish-update.mjs publish
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: Copy the feed to the old address
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/publish-update.mjs mirror
